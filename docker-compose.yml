version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: fullstack-postgres
    environment:
      POSTGRES_USER: ${DB_USER:-fullstack_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-fullstack_password}
      POSTGRES_DB: ${DB_NAME:-fullstack_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-fullstack_user}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - fullstack-network

  # Backend API (Flask)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: fullstack-backend
    environment:
      DATABASE_URL: postgresql://${DB_USER:-fullstack_user}:${DB_PASSWORD:-fullstack_password}@postgres:5432/${DB_NAME:-fullstack_db}
      FLASK_ENV: development
      FLASK_APP: app.py
      PORT: 5000
    ports:
      - "5000:5000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./backend:/app
    networks:
      - fullstack-network
    command: flask run --host=0.0.0.0

  # Frontend (React/Node.js)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: fullstack-frontend
    environment:
      REACT_APP_API_URL: http://localhost:5000/api
      PORT: 3000
    ports:
      - "3000:3000"
    depends_on:
      - backend
    volumes:
      - ./frontend/src:/app/src
    networks:
      - fullstack-network
    command: npm start

volumes:
  postgres_data:
    driver: local

networks:
  fullstack-network:
    driver: bridge
